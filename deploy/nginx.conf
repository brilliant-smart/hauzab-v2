# Hauzab v2 — nginx server block.
#
# The React SPA shell is served by Laravel (routes/web.php falls through to
# public/index.html), so a single Laravel PHP-FPM block covers both the API
# (/api/*) and the client-side routes. Static assets in backend/public/ — the
# Vite bundle under /assets, the PWA icons, registerSW.js — are served straight
# from disk by try_files.
#
# Replace /var/www/hauzab, the server_name, and the fastcgi socket path with
# your install. Symlink this into /etc/nginx/sites-enabled/ and run `nginx -t`.

server {
    listen 80;
    server_name pos.example.com;
    root /var/www/hauzab/backend/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20m;

    # Cache the immutable Vite assets aggressively; their filenames are hashed.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hand every dynamic request to PHP-FPM.
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}