# Hauzab v2 — optional queue worker (supervisor).
#
# The app ships with QUEUE_CONNECTION=sync and drives all background work from
# the scheduler (sync:push every minute + the daily product-cards seed), so a
# queue worker is NOT required for a standard deploy. Keep this config for
# installs that switch to a real queue driver (e.g. redis) for heavier jobs.
#
# Install: sudo cp deploy/supervisor.conf /etc/supervisor/conf.d/hauzab.conf
# then `sudo supervisorctl reread && sudo supervisorctl update`.

[program:hauzab-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 /var/www/hauzab/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/hauzab/backend/storage/logs/worker.log
stopwaitsecs=3600